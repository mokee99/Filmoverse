
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Filmoverse | Cinema Stories & In-Depth Articles</title>
    <meta name="description" content="Explore in-depth articles about films, TV series, unforgettable characters, and the stories behind Balkan cinema on Filmoverse.">
    <meta name="theme-color" content="#000000">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/favicon/android-chrome-192x192.png">

    <!-- Open Graph -->
    <meta property="og:type" content="article">
    <meta property="og:title" content="Filmoverse | Cinema Stories & In-Depth Articles">
    <meta property="og:description" content="Discover thoughtful film reviews, cultural insights, and compelling stories from the world of Balkan cinema.">
    <meta property="og:url" content="https://tvoj-domen.com/article.html">
    <meta property="og:image" content="https://tvoj-domen.com/assets/images/opengraph.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Filmoverse">
    <meta property="og:locale" content="en_US">

    <!-- CSS -->
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/article.css">

    <!-- JavaScript -->
    <script type="module" src="./js/article.js"></script>
</head>

<body>


<!-- ARTICLE HERO -->
<section class="article-hero">

  <picture class="article-hero__picture">
    <source id="article-hero-mobile" media="(max-width: 767px)" srcset="">
    <source id="article-hero-tablet" media="(max-width: 991px)" srcset="">
    <img id="article-hero-desktop" src="" alt="" class="article-hero__image">
  </picture>

  <div class="article-hero__overlay" aria-hidden="true"></div>

  <div class="article-hero__content">
    <h1 id="article-title" class="article-hero__title"></h1>
    <p id="article-intro" class="article-hero__description"></p>
  </div>

</section>


<!-- ARTICLE CONTENT -->
<article class="article-content">

  <!-- META -->
  <div class="article-meta">
    <span id="article-reading-time" class="article-meta__time"></span>
    <div id="article-genres" class="article-meta__genres"></div>
  </div>

  <!-- SECTION ONE -->
  <section class="article-section">

    <div class="article-text-block">
      <h2 id="section-one-heading-one"></h2>
      <p id="section-one-paragraph-one"></p>
    </div>

    <div class="article-text-block">
      <h2 id="section-one-heading-two"></h2>
      <p id="section-one-paragraph-two"></p>
    </div>

    <figure class="article-image article-image--wide">
      <img id="section-one-image" src="" alt="" loading="lazy">
    </figure>

  </section>

  <!-- SECTION TWO -->
  <section class="article-section">

    <div class="article-text-block">
      <h2 id="section-two-heading-one"></h2>
      <p id="section-two-paragraph-one"></p>
    </div>

    <div class="article-text-block">
      <h2 id="section-two-heading-two"></h2>
      <p id="section-two-paragraph-two"></p>
    </div>

    <figure class="article-image article-image--standard">
      <img id="section-two-image" src="" alt="" loading="lazy">
    </figure>

  </section>

  <!-- SECTION THREE -->
  <section class="article-section">

    <div class="article-text-block">
      <h2 id="section-three-heading-one"></h2>
      <p id="section-three-paragraph-one"></p>
    </div>

    <div class="article-text-block">
      <h2 id="section-three-heading-two"></h2>
      <p id="section-three-paragraph-two"></p>
    </div>

  </section>

</article>

<!-- FULL WIDTH CINEMATIC IMAGE -->
<figure class="article-image article-image--full">
  <img id="section-three-image" src="" alt="" loading="lazy">
</figure>



<!-- RELATED POSTS -->
<section class="related-posts section">

  <div class="container-md">

    <h2 class="related-posts__heading">Related posts</h2>

    <div class="related-posts__grid" id="related-posts-grid"></div>

  </div>

</section>

</body>
</html>
