
<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">
    <div class="container-lg navbar__container">

        <!-- LOGO -->
        <a
            href="./index.html"
            class="navbar__logo"
            aria-label="Filmoverse Home"
        >
            <img
                src="./assets/images/menu/menu-logo.svg"
                alt="Filmoverse"
            >
        </a>

        <!-- HAMBURGER -->
        <button
            class="navbar__toggle"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="fullscreen-menu"
        >
            <span class="navbar__line"></span>
            <span class="navbar__line"></span>
            <span class="navbar__line"></span>
        </button>

    </div>
</header>

========================= -->

>

        <a

        <a
            href="./index.html#hot"

            <span class="menu-card__content">

                </span>

        <a

            <span class="menu-card__overlay"></span>

            <span class="menu-card__content">

                    class="menu-card__arrow"
                    src="./assets/images/menu/arrow-menu.svg"

                >
                <span class="menu-card__title">
                    Blog
                </span>
            </span>

        <a
            href="./index.html#newsletter"

                    src="./assets/images/menu/arrow-menu.svg"

                <span
                    class="menu-card__title menu-card__title--short"
                    aria-hidden="true"

                    News

                <!-- DESKTOP OPEN / TABLET / MOBILE -->
                <span
